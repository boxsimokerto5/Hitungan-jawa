name: Build & Sign Android APK & AAB (Play Store Ready)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (Release)'
        required: false
        default: 'Release'

jobs:
  build:
    name: Build & Sign Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare Secrets Configuration Files
        run: |
          # Preserve .env.example if exists, otherwise generate valid template
          if [ ! -f .env.example ]; then
            cat << 'EOF' > .env.example
          IRONSOURCE_APP_KEY=your_ironsource_app_key_here
          IRONSOURCE_BANNER_1_ID=your_ironsource_banner_1_id_here
          IRONSOURCE_BANNER_2_ID=your_ironsource_banner_2_id_here
          IRONSOURCE_INTERSTITIAL_ID=your_ironsource_interstitial_id_here
          IRONSOURCE_NATIVE_ID=your_ironsource_native_id_here
          IRONSOURCE_REWARDED_ID=your_ironsource_rewarded_id_here
          EOF
          fi

          # Prepare .env from secrets with default fallbacks
          APP_KEY="${{ secrets.IRONSOURCE_APP_KEY }}"
          [ -z "$APP_KEY" ] && APP_KEY="28923b09d"

          B1="${{ secrets.IRONSOURCE_BANNER_1_ID }}"
          [ -z "$B1" ] && B1="u69dlx056j56xqeo"

          B2="${{ secrets.IRONSOURCE_BANNER_2_ID }}"
          [ -z "$B2" ] && B2="89bmz131ymy183nt"

          INT_ID="${{ secrets.IRONSOURCE_INTERSTITIAL_ID }}"
          [ -z "$INT_ID" ] && INT_ID="9q3ur98wulcj7q2s"

          NAT_ID="${{ secrets.IRONSOURCE_NATIVE_ID }}"
          [ -z "$NAT_ID" ] && NAT_ID="tmf1a39uruhmkzjb"

          REW_ID="${{ secrets.IRONSOURCE_REWARDED_ID }}"
          [ -z "$REW_ID" ] && REW_ID="2wm05o1m4l5n6s8n"

          cat << EOF > .env
          IRONSOURCE_APP_KEY=$APP_KEY
          IRONSOURCE_BANNER_1_ID=$B1
          IRONSOURCE_BANNER_2_ID=$B2
          IRONSOURCE_INTERSTITIAL_ID=$INT_ID
          IRONSOURCE_NATIVE_ID=$NAT_ID
          IRONSOURCE_REWARDED_ID=$REW_ID
          EOF

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        id: setup-keystore
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          DEFAULT_PASS="KalenderJawaPass2026!"
          DEFAULT_ALIAS="upload"

          STORE_PW="${{ secrets.STORE_PASSWORD }}"
          [ -z "$STORE_PW" ] && STORE_PW="$DEFAULT_PASS"

          KEY_PW="${{ secrets.KEY_PASSWORD }}"
          [ -z "$KEY_PW" ] && KEY_PW="$STORE_PW"

          ALIAS_NAME="${{ secrets.KEY_ALIAS }}"
          [ -z "$ALIAS_NAME" ] && ALIAS_NAME="$DEFAULT_ALIAS"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secret (KEYSTORE_BASE64)..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
          elif [ -f "$KEYSTORE_FILE" ]; then
            echo "Using existing repository upload keystore ($KEYSTORE_FILE)..."
          else
            echo "Generating automatic release keystore for Google Play Store signature..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PW" \
              -keypass "$KEY_PW" \
              -dname "CN=Kalender Jawa, OU=Mobile App, O=GecckoCreator, L=Yogyakarta, ST=DIY, C=ID"
            echo "Keystore created successfully."
          fi
          
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PW" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PW" >> $GITHUB_ENV
          echo "KEY_ALIAS=$ALIAS_NAME" >> $GITHUB_ENV
          
          # Extract Fingerprints for Google Play Console / OAuth setup
          echo "Extracting keystore certificate fingerprints..."
          CERT_INFO=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PW" -alias "$ALIAS_NAME")
          SHA1_FINGERPRINT=$(echo "$CERT_INFO" | grep "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256_FINGERPRINT=$(echo "$CERT_INFO" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          
          echo "SHA1=$SHA1_FINGERPRINT" >> $GITHUB_ENV
          echo "SHA256=$SHA256_FINGERPRINT" >> $GITHUB_ENV

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build Signed Release AAB (Android App Bundle for Google Play)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Package Output Artifacts & Generate Release Documentation
        run: |
          mkdir -p release-artifacts
          
          # Locate and copy generated APK
          APK_PATH=$(find app/build -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build -name "*.apk" 2>/dev/null | grep -v "unaligned" | head -n 1)
          fi
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" release-artifacts/Kalender-Jawa-v1.0-release.apk
            echo "Signed APK copied successfully from $APK_PATH."
          fi
          
          # Locate and copy generated AAB
          AAB_PATH=$(find app/build -name "*release*.aab" 2>/dev/null | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find app/build -name "*.aab" 2>/dev/null | head -n 1)
          fi
          if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" release-artifacts/Kalender-Jawa-v1.0-release.aab
            echo "Signed AAB copied successfully from $AAB_PATH."
          fi
          
          # Backup keystore and create base64 string
          cp "${{ env.KEYSTORE_PATH }}" release-artifacts/upload-keystore.jks
          base64 -w 0 "${{ env.KEYSTORE_PATH }}" > release-artifacts/upload-keystore.base64.txt
          
          # Generate documentation text file
          cat << EOF > release-artifacts/RELEASE_SIGNING_INFO.txt
          ======================================================================
          KALENDER JAWA (ALMANAK & WETON) - RELEASE SIGNING DETAILS
          ======================================================================
          App Name                     : Kalender Jawa
          Package Name (ApplicationId) : com.hitunganjawa.gecckocreator
          Version Name                 : 1.0
          Version Code                 : 1
          
          ----------------------------------------------------------------------
          FILE ARTIFACTS:
          ----------------------------------------------------------------------
          1. Kalender-Jawa-v1.0-release.aab
             -> Android App Bundle (AAB). Upload this file to Google Play Console.
          
          2. Kalender-Jawa-v1.0-release.apk
             -> Direct-install standalone APK file for Android smartphones.
          
          3. upload-keystore.jks
             -> Keystore file used to sign the app. SIMPAN FILE INI DENGAN AMAN!
                File ini diperlukan untuk menandatangani pembaruan aplikasi di Play Store.
          
          4. upload-keystore.base64.txt
             -> Base64 string dari file keystore. Dapat disimpan di GitHub Secrets
                (KEYSTORE_BASE64) untuk build CI/CD otomatis berikutnya.
          
          ----------------------------------------------------------------------
          KEYSTORE CREDENTIALS:
          ----------------------------------------------------------------------
          Keystore Alias    : ${{ env.KEY_ALIAS }}
          Keystore Password : ${{ env.STORE_PASSWORD }}
          Key Password      : ${{ env.KEY_PASSWORD }}
          SHA-1 Fingerprint : ${{ env.SHA1 }}
          SHA-256 Fingerprint: ${{ env.SHA256 }}
          ======================================================================
          EOF
          
          # Write to GitHub Actions Step Summary
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 Kalender Jawa Release Build Complete!
          
          | Property | Value |
          |---|---|
          | **Application ID** | \`com.hitunganjawa.gecckocreator\` |
          | **App Version** | \`1.0\` (versionCode: 1) |
          | **Keystore Alias** | \`${{ env.KEY_ALIAS }}\` |
          | **Keystore Password** | \`${{ env.STORE_PASSWORD }}\` |
          | **SHA-1 Fingerprint** | \`${{ env.SHA1 }}\` |
          | **SHA-256 Fingerprint** | \`${{ env.SHA256 }}\` |
          
          ### 📦 Generated Files:
          - **Google Play Bundle**: \`Kalender-Jawa-v1.0-release.aab\` (Siap upload ke Play Console)
          - **Direct Install APK**: \`Kalender-Jawa-v1.0-release.apk\` (Bisa langsung diinstall di HP)
          - **Keystore Backup**: \`upload-keystore.jks\`
          EOF

      - name: Upload Signed Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: PlayStore-Release-AAB
          path: release-artifacts/Kalender-Jawa-v1.0-release.aab
          retention-days: 30

      - name: Upload Direct Install APK
        uses: actions/upload-artifact@v4
        with:
          name: DirectInstall-Release-APK
          path: release-artifacts/Kalender-Jawa-v1.0-release.apk
          retention-days: 30

      - name: Upload Complete Release Package & Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Complete-Release-Package-with-Keystore
          path: release-artifacts/
          retention-days: 30
